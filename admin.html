<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmic Supreme — Admin Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#070914;color:#eef4ff}
.wrap{max-width:900px;margin:40px auto;padding:20px}.panel{background:#11162a;border:1px solid #27304d;border-radius:18px;padding:26px;box-shadow:0 20px 60px #0005}
h1{margin-top:0}.muted{color:#9ba8c7}label{display:block;margin:18px 0 7px;font-weight:700}
input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #303b5d;background:#080c19;color:#fff;font:inherit}
textarea{min-height:220px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
button{margin-top:20px;padding:13px 20px;border:0;border-radius:10px;background:#7568ff;color:white;font-weight:800;cursor:pointer}
button:disabled{opacity:.6}.status{margin-top:18px;padding:13px;border-radius:10px;background:#0b1020}.articles{margin-top:25px}
.article{padding:15px;border-bottom:1px solid #27304d}.danger{background:#a83246}
a{color:#9ea5ff}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div class="panel">
<h1>🚀 Cosmic Supreme Admin</h1>
<p class="muted">Daily article publisher for your GitHub Pages website.</p>
<div class="row">
<div><label>GitHub username</label><input id="user" value="donv203-cmyk"></div>
<div><label>Repository</label><input id="repo" value="Cosmic-Supreme"></div>
</div>
<label>GitHub Fine-grained Token</label>
<input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
<p class="muted">Token is used only in this browser session and is not saved. Give it <b>Contents: Read and write</b> access to this repository.</p>
<div class="row">
<div><label>Article title</label><input id="title" placeholder="Today's Cosmic Theory"></div>
<div><label>Date</label><input id="date" type="date"></div>
</div>
<label>Short description</label><input id="desc" placeholder="One-line summary">
<label>Article content</label><textarea id="content" placeholder="Write your article here..."></textarea>
<label>Image URL (optional)</label><input id="image" placeholder="https://...">
<button id="publish">Publish Article</button>
<div id="status" class="status">Ready.</div>
<div class="articles"><h2>Published Articles</h2><div id="list">Loading...</div></div>
<p><a href="./">← Back to website</a></p>
</div></div>
<script>
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);
let articles=[];
async function api(path,opts={}){
 const token=$("token").value.trim();
 if(!token) throw new Error("Enter your GitHub token first.");
 const r=await fetch("https://api.github.com/repos/"+$("user").value.trim()+"/"+$("repo").value.trim()+"/"+path,{...opts,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28",...(opts.headers||{})}});
 const data=await r.json(); if(!r.ok) throw new Error(data.message||("GitHub error "+r.status)); return data;
}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function render(){ $("list").innerHTML=articles.length?articles.map((a,i)=>'<div class="article"><b>'+esc(a.title)+'</b><div class="muted">'+esc(a.date||"")+'</div><div>'+esc(a.description||"")+'</div></div>').join(""):"No articles yet."}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function load(){
 try{const f=await api("contents/articles.json"); articles=JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g,""))))); render(); $("status").textContent="Connected. "+articles.length+" article(s) published."}
 catch(e){articles=[];render();$("status").textContent="Connect by entering your token, then publish. "+e.message}
}
$("publish").onclick=async()=>{
 const btn=$("publish");btn.disabled=true;
 try{
  const file=await api("contents/articles.json"); const sha=file.sha;
  articles=JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\n/g,"")))));
  articles.unshift({id:Date.now().toString(),title:$("title").value.trim(),date:$("date").value,description:$("desc").value.trim(),content:$("content").value,image:$("image").value.trim()});
  const content=JSON.stringify(articles,null,2);
  await api("contents/articles.json",{method:"PUT",body:JSON.stringify({message:"Publish article: "+$("title").value.trim(),content:b64(content),sha,branch:"main"})});
  $("status").textContent="✅ Published! GitHub Pages will update after the commit builds.";
  $("title").value=$("desc").value=$("content").value=$("image").value="";
  render();
 }catch(e){$("status").textContent="❌ "+e.message}finally{btn.disabled=false}
};
$("token").addEventListener("change",load);
render();
</script></body></html>
